name: Deploy Docs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy-docs.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Alumopper/DatapackSandbox-Docs
          path: docs-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: docs-source
      - run: npm run docs:build
        working-directory: docs-source
        env:
          DOCS_BASE: /DatapackSandbox/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-source/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
