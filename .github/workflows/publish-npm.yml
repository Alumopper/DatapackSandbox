name: Publish npm package

on:
  push:
    tags:
      - vitepress-playground-v*

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-playground:
    name: Publish VitePress playground
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release tag
        run: npm run check:release-tag --workspace @datapack-sandbox/vitepress-playground -- "$GITHUB_REF_NAME"

      - name: Publish public package
        run: npm publish --workspace @datapack-sandbox/vitepress-playground
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
